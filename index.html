<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f8fafc; /* Dark neutral backdrop */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .viewer-card {
      background-color: #ffffff;
      box-shadow: none;
	border: none
      border-radius: 0px;
      max-width: 1000px;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewer-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Fallback placeholder styling if image fails to load */
    .viewer-card img:not([src]), 
    .viewer-card img[src=""] {
      min-height: 400px;
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>

  <main class="viewer-card">
    <!-- Replace 'certificate.png' with the relative path or URL of your image -->
    <img src="certificate.png" alt="Document Preview" id="document-display">
  </main>

</body>
</html>
